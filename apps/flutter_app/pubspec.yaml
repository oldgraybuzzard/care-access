name: careaccess
description: CareAccess is a secure mobile and web platform designed for nonprofit organizations that support children and families, providing onsite access to case information, reporting, and dashboards that help teams protect kids, support families, and improve outcomes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Navigation
  go_router: ^13.0.0

  # Charts & Visualization
  fl_chart: ^1.1.1

  # Tables
  data_table_2: ^2.5.11

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9

  # Utilities
  intl: ^0.18.1
  logger: ^2.0.2+1
  url_launcher: ^6.2.2
  photo_view: ^0.14.0
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  csv: ^6.0.0
  file_picker: ^10.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1

  # Linting
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    # Light mode logos
    - assets/brand/careaccess_icon.svg
    - assets/brand/careaccess_wordmark.svg
    - assets/brand/careaccess_lockup.svg
    # Dark mode logos
    - assets/brand/careaccess_icon_dark.svg
    - assets/brand/careaccess_wordmark_dark.svg
    - assets/brand/careaccess_lockup_dark.svg
    # Favicons
    - assets/brand/favicon.ico
    - assets/brand/favicon_16x16.png
    - assets/brand/favicon_32x32.png
    - assets/brand/favicon_48x48.png
    - assets/brand/favicon_64x64.png

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

